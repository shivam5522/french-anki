phrases:
- id: c02-p001
  fr: Ça va ?
  en: How are you? / How's it going?
- id: c02-p002
  fr: Comment ça va ?
  en: How are you?
- id: c02-p003
  fr: Ça va.
  en: I'm fine.
- id: c02-p004
  fr: Ça va bien.
  en: I'm good.
- id: c02-p005
  fr: Ça va, et toi ?
  en: I'm fine, and you? (informal)
- id: c02-p006
  fr: Salut, ça va ?
  en: Hi, how are you?
- id: c02-p007
  fr: Je m'appelle Mehdi.
  en: My name is Mehdi.
- id: c02-p008
  fr: Tu t'appelles comment ?
  en: What's your name? (informal)
- id: c02-p009
  fr: Vous vous appelez comment ?
  en: What's your name? (formal)
- id: c02-p010
  fr: Je m'appelle Sylvie, et vous ?
  en: My name is Sylvie, and you? (formal)
- id: c02-p011
  fr: Je suis français.
  en: I am French. (man)
- id: c02-p012
  fr: Je suis française.
  en: I am French. (woman)
- id: c02-p013
  fr: Tu viens d'où ?
  en: Where are you from? (informal)
- id: c02-p014
  fr: Vous venez d'où ?
  en: Where are you from? (formal)
- id: c02-p015
  fr: Je suis marocain, et toi ?
  en: I'm Moroccan, and you?
- id: c02-p016
  fr: J'ai trente ans.
  en: I am 30 years old.
- id: c02-p017
  fr: Tu as quel âge ?
  en: How old are you? (informal)
- id: c02-p018
  fr: Vous avez quel âge ?
  en: How old are you? (formal)
- id: c02-p019
  fr: J'ai vingt-cinq ans, et toi ?
  en: I'm 25, and you?
